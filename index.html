<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Biashara Smart</title>
  <style>
    :root{--green:#005746;--green2:#08765e;--gold:#e4ad25;--cream:#f7f2e8;--paper:#fffdf8;--ink:#19332e;--muted:#6d7d78;--line:#d9ddd8;--red:#c94747;--redbg:#fff0ee;--blue:#3e79c7;--bluebg:#eef5ff;--yellow:#d99b18;--yellowbg:#fff7dc;--greenbg:#e8f6ea;--shadow:0 10px 30px rgba(0,50,40,.09)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eee7da,#faf8f2 55%,#e8eee9);color:var(--ink)}
    button,input,select{font:inherit} button{cursor:pointer}
    .app{min-height:100vh;display:flex;justify-content:center}.phone{width:100%;max-width:430px;min-height:100vh;background:var(--paper);position:relative;box-shadow:0 0 60px rgba(0,0,0,.12);overflow:hidden}.screen{padding:24px 18px 92px;min-height:100vh}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.topbar h1{font-size:22px;margin:0}.back{border:0;background:transparent;font-size:25px;color:var(--ink);padding:4px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#e8d4a5,#b88942);display:grid;place-items:center;font-weight:800;color:white}
    .logoMark{width:58px;height:58px;margin:0 auto 12px;position:relative}.logoMark:before,.logoMark:after{content:"";position:absolute;bottom:3px;border-radius:7px 7px 2px 2px;transform:skew(-9deg)}.logoMark:before{left:5px;width:19px;height:35px;background:#2e9b67}.logoMark:after{left:25px;width:20px;height:47px;background:var(--gold)}.logoLeaf{position:absolute;width:20px;height:12px;border-radius:100% 0 100% 0;background:#6ab64b;left:2px;top:5px;transform:rotate(-28deg)}
    .brand{text-align:center;color:var(--green);font-weight:900;font-size:24px;letter-spacing:.3px}.brand span{color:var(--gold)}.tag{text-align:center;color:var(--muted);margin:8px 0 26px}.hero{background:linear-gradient(150deg,#004d3e,#08725b);color:white;border-radius:26px;padding:28px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto -20px -40px;height:130px;border-top:2px solid rgba(228,173,37,.8);border-radius:50%}.hero h2{font-size:30px;line-height:1.08;margin:0 0 8px;position:relative;z-index:1}.hero p{margin:0;opacity:.9;position:relative;z-index:1}.auth{padding-top:34px}.auth .brand{font-size:25px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 7px;color:#536761}.field input,.field select{width:100%;padding:14px 13px;border:1px solid var(--line);border-radius:12px;background:#fffdf9;outline:none}.field input:focus{border-color:var(--green)}
    .btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;width:100%;transition:.15s}.btn.primary{background:var(--green);color:#fff}.btn.secondary{background:white;color:var(--green);border:1px solid #9fcdbf}.btn.gold{background:#f2c34a;color:#143b33}.btn:active{transform:scale(.99)}.divider{display:flex;align-items:center;gap:10px;color:#a0aaa6;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
    .greeting{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.greeting h2{font-size:22px;line-height:1.15;margin:0}.greeting p{margin:5px 0 0;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{border-radius:14px;padding:13px;border:1px solid transparent}.stat .label{font-size:11px;font-weight:700}.stat .value{font-size:17px;font-weight:900;margin-top:5px}.stat.in{background:var(--greenbg);border-color:#c7e8cb}.stat.out{background:var(--redbg);border-color:#f0d0cc}.stat.home{background:var(--bluebg);border-color:#cfdef1}.stat.profit{background:var(--yellowbg);border-color:#f0dfae}.stat.in .label{color:#187246}.stat.out .label{color:#b53c37}.stat.home .label{color:#3d68a0}.stat.profit .label{color:#9a6d09}
    .record{margin:12px 0 18px}.section-title{font-size:14px;font-weight:900;margin:18px 0 10px}.summary{background:#f2f8f1;border:1px solid #d3e7d1;border-radius:15px;padding:14px}.summary .row{display:flex;justify-content:space-between;font-size:13px;margin:7px 0}.summary strong{font-size:14px}.health{margin-top:12px;background:#e8f6e9;border:1px solid #cfe6cf;border-radius:15px;padding:13px;display:flex;gap:10px}.check{width:25px;height:25px;border-radius:50%;background:#bfe4bf;color:#287b39;display:grid;place-items:center;font-weight:900}.health p{margin:0;font-size:12px}.health strong{display:block;margin-bottom:3px}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:74px;background:rgba(255,253,248,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav{border:0;background:transparent;color:#77837f;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav .ico{font-size:20px}.nav.active{color:var(--green);font-weight:900}
    .choice{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;margin:9px 0;text-align:left}.choice .icoBox{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px}.choice strong{display:block;font-size:13px}.choice span{font-size:11px;color:var(--muted)}.choice .arrow{margin-left:auto;color:#8d9995}.choice.green{border-color:#8bc6ae;background:#f5fcf8}.choice.green .icoBox{background:#d6f0e2}.choice.red{border-color:#e9aaa5;background:#fff9f8}.choice.red .icoBox{background:#ffdcd8}.choice.yellow{border-color:#e6c773;background:#fffdf5}.choice.yellow .icoBox{background:#ffe7a3}.choice.blue{border-color:#a7c6eb;background:#f7faff}.choice.blue .icoBox{background:#dceaff}
    .cat{display:flex;align-items:center;padding:11px 4px;border:1px solid transparent;border-radius:11px;margin:5px 0}.cat:hover{background:#f7faf8}.cat.selected{border-color:#58a784;background:#eff9f3}.cat .catico{width:30px;text-align:center}.cat .checkmark{margin-left:auto;color:var(--green);font-weight:900}.amount{font-size:27px;font-weight:900;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin:12px 0 16px}.amount input{width:100%;border:0;outline:0;text-align:center;font-size:27px;font-weight:900;background:transparent}
    .tabs{display:flex;background:#f1f1ec;padding:3px;border-radius:10px;margin:8px 0 14px}.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 4px;font-size:11px}.tab.active{background:var(--green);color:#fff;font-weight:800}.metricRow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{padding:12px;border-radius:13px;background:#f6f6f1;border:1px solid var(--line)}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:16px;margin-top:4px}.barRow{display:grid;grid-template-columns:65px 1fr 34px;align-items:center;gap:7px;margin:9px 0;font-size:11px}.bar{height:7px;border-radius:10px;background:#e6ebe8;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:10px}.reportHero{background:var(--green);color:#fff;border-radius:15px;padding:16px}.reportHero .big{font-size:22px;font-weight:900}.reportHero small{opacity:.85}.reportStats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.chart{height:145px;border:1px solid var(--line);border-radius:14px;margin-top:10px;padding:12px;position:relative;overflow:hidden;background:#fff}.chart svg{width:100%;height:100%}.tip{background:#eef7e9;border:1px solid #d4e8cf;border-radius:13px;padding:12px;font-size:12px}.scoreWrap{text-align:center;padding:15px}.score{width:170px;height:170px;border-radius:50%;margin:0 auto 10px;background:conic-gradient(var(--green) 0 78%,#e6eee8 78% 100%);display:grid;place-items:center;position:relative}.score:after{content:"";position:absolute;width:132px;height:132px;background:#fffdf8;border-radius:50%}.score span{position:relative;z-index:1;font-size:31px;font-weight:900}.good{font-weight:900;color:var(--green)}.insight{padding:12px;border:1px solid var(--line);border-radius:13px;margin:8px 0;font-size:12px}.insight.ok{background:#f3fbf4}.insight.rec{background:#fffaf0}.reportAction{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;margin:8px 0;background:white;text-align:left}.reportAction .ri{font-size:22px}.reportAction strong{display:block;font-size:13px}.reportAction span{font-size:11px;color:var(--muted)}
    .empty{text-align:center;padding:50px 20px;color:var(--muted)}.small{font-size:11px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#173f37;color:#fff;padding:12px 16px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:700px){.phone{margin:24px 0;min-height:calc(100vh - 48px);border-radius:32px}.bottom{bottom:24px;border-radius:0 0 32px 32px}.screen{min-height:calc(100vh - 48px)}}
  </style>
</head>
<body>
<div class="app"><main class="phone" id="app"></main></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://opnqkbkkafjwafmxopeu.supabase.co';
const SUPABASE_KEY='sb_publishable_VMux55sUteb_tf4juWLz0Q_YXKzhGjv';
const SESSION_KEY='biashara-smart-supabase-session';
const defaultState={user:null,business:{id:null,name:'',owner:'',location:''},transactions:[],screen:'home'};
let state={...defaultState,business:{...defaultState.business},transactions:[]};
let session=null;
function save(){/* Business records are stored in Supabase; do not save auth secrets here. */}
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}}
function storeSession(s){session=s;if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY)}
async function authRequest(path,body){
 const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(body)});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.msg||data.message||data.error_description||data.error||'Authentication failed');
 return data;
}
async function dbRequest(path,options={}){
 if(!session?.access_token)throw new Error('Please log in again to continue.');
 const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json',...(options.headers||{})};
 const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers});
 const raw=await r.text();let data=null;try{data=raw?JSON.parse(raw):null}catch(e){data=raw}
 if(!r.ok)throw new Error(data?.message||data?.hint||data?.details||'Database request failed ('+r.status+')');
 return data;
}
function showError(e){console.error(e);toast(e?.message||'Something went wrong. Please try again.')}
function mapTransaction(x){return {id:x.id,type:x.transaction_type,amount:Number(x.amount),category:x.category||'',customer:x.customer_name||'',description:x.description||'',date:x.transaction_date}}
async function loadCloudData(){
 const uid=session.user.id;
 const businesses=await dbRequest('businesses?select=*&user_id=eq.'+encodeURIComponent(uid)+'&order=created_at.asc');
 if(!businesses?.length){
   const bizName=prompt('What is your business name?');
   if(!bizName){state.user=null;render();return}
   const owner=session.user.user_metadata?.full_name||session.user.email||'Business owner';
   const created=await dbRequest('businesses',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({user_id:uid,business_name:bizName, business_type:null,location:'Kenya'})});
   const b=Array.isArray(created)?created[0]:created;
   state.business={id:b.id,name:b.business_name,owner,location:b.location||'Kenya'};
 }else{
   const b=businesses[0];
   state.business={id:b.id,name:b.business_name,owner:session.user.user_metadata?.full_name||session.user.email||'Business owner',location:b.location||'Kenya'};
 }
 const rows=await dbRequest('transactions?select=*&business_id=eq.'+encodeURIComponent(state.business.id)+'&order=transaction_date.desc,created_at.desc');
 state.transactions=(rows||[]).map(mapTransaction);
 state.user={id:session.user.id,email:session.user.email,name:session.user.user_metadata?.full_name||session.user.email};
 state.screen='home';render();
}
async function createCloudTransaction(type,amount,category='',customer='',description=''){
 if(!session?.user?.id||!state.business.id)throw new Error('Your business profile is not ready. Please log in again.');
 const result=await dbRequest('transactions',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({
  user_id:session.user.id,business_id:state.business.id,transaction_type:type,amount:Number(amount),
  category:category||null,customer_name:customer||null,description:description||null,
  transaction_date:new Date().toISOString().slice(0,10)
 })});
 const row=Array.isArray(result)?result[0]:result;
 if(row)state.transactions.unshift(mapTransaction(row));
}
const money=n=>'KSh '+Number(n||0).toLocaleString('en-KE',{maximumFractionDigits:0});
const today=()=>new Date().toISOString().slice(0,10);
function tx(type,amount,category=''){return {id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),type,amount:Number(amount),category,date:today()}}
function totals(){let t=state.transactions;let inc=t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0), out=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0), home=t.filter(x=>x.type==='owner_withdrawal').reduce((a,x)=>a+x.amount,0), owe=t.filter(x=>x.type==='credit_given').reduce((a,x)=>a+x.amount,0);return {inc,out,home,profit:inc-out,owe}}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function logo(){return `<div class="logoMark"><i class="logoLeaf"></i></div>`}
function shell(content,active='home'){return `<div class="screen">${content}</div>${state.user?nav(active):''}`}
function nav(active){return `<nav class="bottom"><button class="nav ${active==='home'?'active':''}" onclick="go('home')"><span class="ico">⌂</span>Home</button><button class="nav ${active==='money'?'active':''}" onclick="go('record')"><span class="ico">◉</span>Money</button><button class="nav ${active==='business'?'active':''}" onclick="go('business')"><span class="ico">▦</span>Business</button><button class="nav ${active==='reports'?'active':''}" onclick="go('reports')"><span class="ico">▤</span>Reports</button></nav>`}
function render(){
 const app=document.getElementById('app');
 if(!state.user){app.innerHTML=login();return}
 const views={home:home,record:record,moneyout:moneyout,moneyin:moneyin,credit:credit,withdraw:withdraw,business:business,reports:reports,monthly:monthly,health:health};
 app.innerHTML=(views[state.screen]||home)();
}
function login(){return `<div class="screen auth">${logo()}<div class="brand">BIASHARA <span>SMART</span></div><p class="tag">Your business, made simple.</p><div class="hero"><h2>Build a clearer business.</h2><p>Track your money without accounting language.</p></div><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div><button class="btn primary" onclick="loginNow()">Log In</button><div class="divider">or</div><button class="btn secondary" onclick="signup()">Create an account</button><p class="small" style="text-align:center;margin-top:18px">Your business records are stored in your Supabase project.</p></div>`}
async function loginNow(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('pass').value;
 if(!email||!password){toast('Enter your email and password');return}
 try{
  const data=await authRequest('token?grant_type=password',{email,password});
  storeSession(data);await loadCloudData();toast('Logged in successfully');
 }catch(e){showError(e)}
}
async function signup(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('pass').value;
 if(!email||!password){toast('Enter your email and password first');return}
 if(password.length<6){toast('Use a password with at least 6 characters');return}
 const name=prompt('Your name');
 if(!name)return;
 const biz=prompt('Business name');
 if(!biz)return;
 try{
  const data=await authRequest('signup',{email,password,data:{full_name:name}});
  if(!data.access_token||!data.user){
   toast('Account created. Check your email to confirm it, then log in.');
   return;
  }
  storeSession(data);
  const created=await dbRequest('businesses',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({user_id:data.user.id,business_name:biz,business_type:null,location:'Kenya'})});
  const b=Array.isArray(created)?created[0]:created;
  state.business={id:b.id,name:b.business_name,owner:name,location:b.location||'Kenya'};
  state.user={id:data.user.id,email:data.user.email,name};
  state.transactions=[];state.screen='home';render();toast('Account created');
 }catch(e){showError(e)}
}
function header(title,back=true){return `<div class="topbar">${back?`<button class="back" onclick="backHome()">‹</button>`:'<span></span>'}<h1>${title}</h1><span></span></div>`}
function backHome(){state.screen='home';save();render()}
function home(){const t=totals();let n=state.business.owner||'Business owner';return shell(`<div class="greeting"><div><h2>Good evening,<br>${esc(n)} 👋</h2><p>Let's see how your business did today.</p></div><div class="avatar">${esc(n[0]||'B')}</div></div><div class="section-title">Today's Summary</div><div class="cards"><div class="stat in"><div class="label">Money In</div><div class="value">${money(t.inc)}</div></div><div class="stat out"><div class="label">Money Out</div><div class="value">${money(t.out)}</div></div><div class="stat home"><div class="label">Taken Home</div><div class="value">${money(t.home)}</div></div><div class="stat profit"><div class="label">Estimated Profit</div><div class="value">${money(t.profit)}</div></div></div><div class="record"><button class="btn primary" onclick="go('record')">＋ Record Money</button></div><div class="section-title">Your business this month</div><div class="summary"><div class="row"><span>Sales</span><strong>${money(t.inc)}</strong></div><div class="row"><span>Expenses</span><strong>${money(t.out)}</strong></div><div class="row"><span>Profit</span><strong>${money(t.profit)}</strong></div></div><div class="health"><div class="check">✓</div><p><strong>${t.profit>=0?'Your business is doing well!':'Let’s improve this together.'}</strong>${t.profit>=0?'Your records are up to date.':'Record more sales and expenses to see a clearer picture.'}</p></div>`, 'home')}
function record(){return shell(`${header('What happened?')}<p class="small">Select what you want to record.</p><button class="choice green" onclick="go('moneyin')"><span class="icoBox">▣</span><span><strong>I received money</strong><span>Sales, credit received, other income</span></span><b class="arrow">›</b></button><button class="choice red" onclick="go('moneyout')"><span class="icoBox">◉</span><span><strong>I spent money</strong><span>Stock, transport, rent, wages, etc.</span></span><b class="arrow">›</b></button><button class="choice yellow" onclick="go('credit')"><span class="icoBox">↗</span><span><strong>Someone owes me</strong><span>Credit sales, pending payments</span></span><b class="arrow">›</b></button><button class="choice blue" onclick="go('withdraw')"><span class="icoBox">↙</span><span><strong>I took money home</strong><span>Personal withdrawal</span></span><b class="arrow">›</b></button>`, 'money')}
function moneyout(){return shell(`${header('I spent money')}<p class="small">How much did you spend?</p><div class="amount"><input id="amt" inputmode="numeric" placeholder="KSh 0"></div><div class="section-title">What was it for?</div>${categories(['Stock','Transport','Rent','Wages','Electricity','Airtime/Data','Other'])}<button class="btn primary" onclick="addExpense()">Done ✓</button>`, 'money')}
function categories(list){return list.map((x,i)=>`<div class="cat" onclick="pickCat(this,'${x}')"><span class="catico">${['▣','▰','⌂','♙','▤','▯','•'][i]}</span><span>${x}</span><span class="checkmark"></span></div>`).join('')}
function pickCat(el,x){document.querySelectorAll('.cat').forEach(c=>{c.classList.remove('selected');c.querySelector('.checkmark').textContent=''});el.classList.add('selected');el.querySelector('.checkmark').textContent='✓';el.dataset.value=x}
function selectedCat(){return document.querySelector('.cat.selected')?.dataset.value||'Other'}
async function addExpense(){let a=Number(document.getElementById('amt').value.replace(/[^0-9.]/g,''));if(!a){toast('Enter an amount');return}try{await createCloudTransaction('expense',a,selectedCat());toast('Expense saved to your account');go('home')}catch(e){showError(e)}}
function moneyin(){return shell(`${header('I received money')}<p class="small">What kind of income was it?</p><button class="choice green" onclick="selectIncome(this,'Sales')"><span class="icoBox">▣</span><span><strong>Sales</strong><span>Cash, M-Pesa, Card</span></span><b class="arrow">›</b></button><button class="choice" onclick="selectIncome(this,'Credit received')"><span class="icoBox">▣</span><span><strong>Credit received</strong><span>Money from customers</span></span><b class="arrow">›</b></button><button class="choice" onclick="selectIncome(this,'Other income')"><span class="icoBox">◉</span><span><strong>Other income</strong><span>Side income, refunds, etc.</span></span><b class="arrow">›</b></button><div class="section-title">Amount</div><div class="amount"><input id="inamt" inputmode="numeric" placeholder="KSh 0"></div><button class="btn primary" onclick="addIncome()">Done ✓</button>`, 'money')}
function selectIncome(el,x){document.querySelectorAll('.choice').forEach(c=>c.style.outline='none');el.style.outline='2px solid #58a784';el.dataset.value=x}
async function addIncome(){let a=Number(document.getElementById('inamt').value.replace(/[^0-9.]/g,''));if(!a){toast('Enter an amount');return}let c=document.querySelector('.choice[style*="outline"]')?.dataset.value||'Sales';try{await createCloudTransaction('income',a,c);toast('Money in saved to your account');go('home')}catch(e){showError(e)}}
function credit(){return shell(`${header('Someone owes me')}<p class="small">Record a sale you expect to receive later.</p><div class="field"><label>Customer name</label><input id="cust" placeholder="e.g. Brian"></div><div class="amount"><input id="camt" inputmode="numeric" placeholder="KSh 0"></div><div class="field"><label>What was sold?</label><input id="cdesc" placeholder="e.g. 2 bags of rice"></div><button class="btn primary" onclick="addCredit()">Save credit</button>`, 'money')}
async function addCredit(){let a=Number(document.getElementById('camt').value.replace(/[^0-9.]/g,''));if(!a){toast('Enter an amount');return}try{await createCloudTransaction('credit_given',a,'Credit sale',document.getElementById('cust').value,document.getElementById('cdesc').value);toast('Customer credit saved to your account');go('home')}catch(e){showError(e)}}
function withdraw(){return shell(`${header('I took money home')}<p class="small">How much did you take from the business for personal use?</p><div class="amount"><input id="wamt" inputmode="numeric" placeholder="KSh 0"></div><button class="btn primary" onclick="addWithdraw()">Done ✓</button>`, 'money')}
async function addWithdraw(){let a=Number(document.getElementById('wamt').value.replace(/[^0-9.]/g,''));if(!a){toast('Enter an amount');return}try{await createCloudTransaction('owner_withdrawal',a,'Taken Home');toast('Withdrawal saved to your account');go('home')}catch(e){showError(e)}}
function business(){const t=totals();return shell(`${header('My Business',false)}<div class="tabs"><button class="tab active">Today</button><button class="tab">This Week</button><button class="tab">This Month</button></div><div class="metricRow"><div class="metric"><span>Sales</span><strong>${money(t.inc)}</strong></div><div class="metric"><span>Expenses</span><strong>${money(t.out)}</strong></div></div><div class="metric" style="margin-top:9px;background:#fff7dc"><span>Estimated Profit</span><strong>${money(t.profit)}</strong></div><div class="section-title">Top Expenses</div>${expenseBars()}<div class="section-title">Business Profile</div><div class="summary"><div class="row"><span>Name</span><strong>${esc(state.business.name)}</strong></div><div class="row"><span>Owner</span><strong>${esc(state.business.owner)}</strong></div><div class="row"><span>Location</span><strong>${esc(state.business.location)}</strong></div></div>`, 'business')}
function expenseBars(){let t={};state.transactions.filter(x=>x.type==='expense').forEach(x=>t[x.category]=(t[x.category]||0)+x.amount);let total=Object.values(t).reduce((a,b)=>a+b,0)||1;return Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div class="barRow"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(v/total*100)}%"></i></div><b>${Math.round(v/total*100)}%</b></div>`).join('')||'<p class="small">Your expense breakdown will appear here as you record money out.</p>'}
function monthly(){const t=totals();return shell(`${header('Monthly Report')}<div class="reportHero"><small>September 2026</small><div class="big">Total Sales ${money(t.inc)}</div><small>↑ Your sales and records are being tracked.</small></div><div class="reportStats"><div class="metric"><span>Total Expenses</span><strong>${money(t.out)}</strong></div><div class="metric"><span>Estimated Profit</span><strong>${money(t.profit)}</strong></div></div><div class="section-title">Sales & Expenses Trend</div><div class="chart"><svg viewBox="0 0 330 120" preserveAspectRatio="none"><polyline points="0,98 35,80 70,88 105,58 140,72 175,48 210,62 245,43 280,51 330,22" fill="none" stroke="#08765e" stroke-width="3"/><polyline points="0,108 35,98 70,103 105,82 140,90 175,73 210,86 245,72 280,78 330,61" fill="none" stroke="#e4ad25" stroke-width="3"/><line x1="0" y1="108" x2="330" y2="108" stroke="#d9ddd8"/></svg></div><div class="tip"><b>💡 Business Tip</b><br>Keep recording every sale and expense. The more complete your records, the more useful your business report becomes.</div>`, 'reports')}
function health(){const t=totals();let score=t.inc>0?Math.max(40,Math.min(95,Math.round(60+(t.profit/Math.max(t.inc,1))*40))):50;return shell(`${header('Business Health Score')}<div class="scoreWrap"><div class="score"><span>${score}<small style="font-size:14px">/100</small></span></div><div class="good">${score>=70?'Good':'Getting started'}</div><p class="small">Your records help you see how the business is doing.</p></div><div class="section-title">Key Insights</div><div class="insight ok">✓ ${t.inc?'You are recording sales.':'Start recording your sales every day.'}</div><div class="insight ok">✓ ${t.out?'You are tracking expenses.':'Start recording what you spend.'}</div><div class="insight ok">✓ ${t.profit>=0?'Your recorded income is currently above expenses.':'Your expenses are currently above recorded income.'}</div><div class="section-title">Recommendations</div><div class="insight rec">💡 Keep your daily records complete and separate business money from personal money where possible.</div>`, 'business')}
function reports(){return shell(`${header('Reports',false)}<div class="tabs"><button class="tab active">Monthly</button><button class="tab">Quarterly</button><button class="tab">Yearly</button></div><button class="reportAction" onclick="go('monthly')"><span class="ri">📄</span><span><strong>View Monthly Report</strong><span>Full business summary</span></span>›</button><button class="reportAction" onclick="downloadReport()"><span class="ri">⬇️</span><span><strong>Download Report</strong><span>Save a copy for your records</span></span>›</button><button class="reportAction" onclick="exportCSV()"><span class="ri">📊</span><span><strong>Export CSV</strong><span>Open your records in Excel</span></span>›</button><div class="hero" style="margin-top:18px;min-height:160px"><h2 style="font-size:22px">Better records.<br>Bigger opportunities.</h2><p>Your business data can help you build a stronger financial profile.</p></div>`, 'reports')}
function downloadReport(){const t=totals();const text=`BIASHARA SMART\nBusiness: ${state.business.name}\nOwner: ${state.business.owner}\n\nSales: ${money(t.inc)}\nExpenses: ${money(t.out)}\nTaken Home: ${money(t.home)}\nEstimated Profit: ${money(t.profit)}\nCustomers Owe: ${money(t.owe)}\n`;downloadBlob(text,'biashara-smart-report.txt','text/plain');toast('Report downloaded')}
function exportCSV(){let rows=[['Date','Type','Category','Amount','Customer','Description'],...state.transactions.map(x=>[x.date,x.type,x.category,x.amount,x.customer||'',x.description||''])];downloadBlob(rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'biashara-smart-transactions.csv','text/csv');toast('CSV exported')}
function downloadBlob(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function go(s){state.screen=s;save();render();window.scrollTo(0,0)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function startApp(){
 session=readSession();
 if(session?.access_token&&session?.user){
  try{await loadCloudData();return}catch(e){console.warn('Could not restore Supabase session',e);storeSession(null)}
 }
 render();
}
startApp();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
